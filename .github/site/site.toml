]

[[faq]]
q = "How do I run gpt-web-gateway?"
a = "Build the Docker image and run it with the auth/ and images volumes mounted and API_KEY set, or copy .env.example to .env and run docker compose up -d. Then open /login once to sign in to ChatGPT; the session is saved to the auth/ volume."

[[faq]]
q = "Can I use it with the OpenAI SDK?"
a = "Yes. Point the client at the gateway, for example base_url http://localhost:3000/v1 with your API_KEY as api_key, and call chat completions or images.generate as usual. The model field is accepted and ignored."

[[faq]]
q = "Is using it allowed by OpenAI?"
a = "No. Automating the ChatGPT web interface violates OpenAI's Terms of Use and the account can be suspended or banned without warning. Use a dedicated account with its own Plus or Pro subscription, never your main one."

[[faq]]
q = "Does it bypass ChatGPT rate limits or the subscription?"
a = "No. You need your own Plus or Pro subscription, the account's limits still apply, and the gateway applies cooldowns when ChatGPT rate-limits the account."

[[faq]]
q = "How do I secure the gateway?"
a = "Never expose it without authentication: set API_KEY, put auth on your reverse proxy or bind the port to localhost. The web UI at /, generated images under /images/, /health and /metrics stay outside API_KEY by design, and the auth/ volume holds session cookies, so keep it private."

[[faq]]
q = "How many requests can it handle at once?"
a = "Up to MAX_CONCURRENT_JOBS jobs run in parallel (1 to 5, default 3), each on its own browser tab; further jobs wait in a queue capped by MAX_QUEUE_SIZE. It is a personal or team gateway, not a high-throughput proxy."
